<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="page">
        <div class="calculator">
            <div class="displayText">
                <input type="text" class="textBox">
            </div>
            <div class="calculatorbody">
                <div class="numberbuttons">
                    <button id="0" class="num0" type="button">1</button>
                    <button id="1" class="num1" type="button">2</button>
                    <button id="2" class="num2" type="button">3</button>
                    <button id="3" class="num3" type="button">4</button>
                    <button id="4" class="num4" type="button">5</button>
                    <button id="5" class="num5" type="button">6</button>
                    <button id="6" class="num6" type="button">7</button>
                    <button id="7" class="num7" type="button">8</button>
                    <button id="8" class="num8" type="button">9</button>
                    <button id="9" class="num9" type="button">0</button>
                </div>
                <div class="mainOperators">
                    <button class="allclear" type="button">AC</button>
                    <button class="addition" type="button">+</button>
                    <button class="subtract" type="button">-</button>
                    <button class="multiply" type="button">×</button>
                    <button class="divide" type="button">÷</button>
                    <button class="equals" type="button">=</button>
                </div>
            </div>
        </div>
    </div>
    <!-- <script src="script.js"></script> -->
</body>

</html>
