<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="page">
        <div class="calculator">
            <div class="displayText">
                <input type="text" id="display" class="textBox" readonly>
            </div>
            <div class="calculatorbody">
                <div class="numberbuttons">
                    <button id="num1" class="nums" type="button">1</button>
                    <button id="num2" class="nums" type="button">2</button>
                    <button id="num3" class="nums" type="button">3</button>
                    <button id="num4" class="nums" type="button">4</button>
                    <button id="num5" class="nums" type="button">5</button>
                    <button id="num6" class="nums" type="button">6</button>
                    <button id="num7" class="nums" type="button">7</button>
                    <button id="num8" class="nums" type="button">8</button>
                    <button id="num9" class="nums" type="button">9</button>
                    <button id="num0" class="nums" type="button">0</button>
                </div>
                <div class="mainOperators">
                    <button class="allclear" type="button">AC</button>
                    <button class="addition" type="button">+</button>
                    <button class="subtraction" type="button">-</button>
                    <button class="multiplication" type="button">×</button>
                    <button class="division" type="button">÷</button>
                    <button class="equals" type="button">=</button>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
